name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Build retrieval index
        run: PYTHONPATH=src python scripts/build_index.py --docs sample_docs --out local_index.json
      - name: Run retrieval evaluation
        run: PYTHONPATH=src python scripts/evaluate.py --index local_index.json --cases evals/regression_qa.json --k 3
      - name: Compile source
        run: PYTHONPYCACHEPREFIX=.pycache_tmp python -m compileall src tests scripts
